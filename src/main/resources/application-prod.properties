spring.application.name=PI_v0.1

### SERVER ###
server.port=8080
server.servlet.context-path=/SpringSecurity

### DATABASE AZURE ###
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

### JPA / HIBERNATE ###
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

### JWT ###
app.jwt.secret=MySuperSecretKeyForJWtAuthSpringSecurityZ0261
app.jwt.expiration-ms=3600000

### FILE UPLOAD ###
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads/products
app.upload.sponsors.dir=uploads/sponsors
app.base-url=${APP_BASE_URL}